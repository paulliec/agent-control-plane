[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-control-plane-lite"
version = "0.1.0"
description = "Observability and governance for AI agents and MCP tool usage across platforms"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Paul Carson" }]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "pandas>=2.2", "altair>=5.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
acp = "agent_control_plane.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_control_plane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# Coverage lives here rather than in pytest addopts so a plain `pytest` stays
# fast and ungated; CI opts in with `pytest --cov`. Floor sits just under the
# current 96.87% so a fractional shift doesn't fail the build spuriously.
[tool.coverage.run]
source = ["agent_control_plane"]

[tool.coverage.report]
fail_under = 96
show_missing = true

[tool.mypy]
python_version = "3.12"
# Tests and scripts are checked too: a fixture with a wrong type is how a test
# passes vacuously. mypy_path lets them resolve the package from src/.
files = ["src", "tests", "scripts"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
