# The smallest gate that keeps the repo at its known-good baseline: format,
# lint, types, tests with coverage, and a real run of the demo pipeline.
#
# No matrix. Every tool in this repo is pinned to 3.12 (requires-python,
# ruff target-version, mypy python_version), so a second interpreter would be
# testing a configuration the project doesn't claim to support.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Format
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy --strict

      - name: Tests
        run: pytest --cov

      # This repo is credential-free and deterministic, which is exactly what
      # makes an end-to-end smoke cheap. It has caught wiring regressions the
      # unit tests missed.
      - name: Seed demo
        run: python scripts/seed_demo.py --reset

      - name: CLI smoke
        run: |
          acp stats
          acp runs
          acp violations
          acp trace mcp-analyst-2026-08-06
          acp evaluate
